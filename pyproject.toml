[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splitcall"
version = "0.1.0"
description = "Chunk-boundary fuzzer and repair parser for streaming tool calls"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "gfxroy" }]
keywords = ["llm", "tool-calling", "streaming", "fuzzer"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "ijson",
  "jsonschema",
  "mistral-common>=1.13",
  "openai>=2.25",
  "orjson",
  "partial-json-parser",
  "pydantic>=2",
  "referencing",
  "regex",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
splitcall = "splitcall.cli:main"

[project.urls]
Homepage = "https://github.com/gfxroy/splitcall"
Repository = "https://github.com/gfxroy/splitcall"

[tool.setuptools.packages.find]
where = ["src"]
include = ["splitcall*"]

[tool.setuptools.package-data]
"splitcall.vendor_path" = ["UPSTREAM_COMMITS.txt", "LICENSE.Apache-2.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
